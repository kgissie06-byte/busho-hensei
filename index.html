<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>編成</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- iPhoneホーム画面追加用アイコン -->
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon/apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon/apple-touch-icon-167x167.png">
<link rel="apple-touch-icon" sizes="76x76" href="icon/apple-touch-icon-76x76.png">
<link rel="icon" href="icon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="編成">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans JP','Hiragino Sans',sans-serif}
:root{
  --bg:#f0ebe0;--panel:#d4c9a8;--card:#e8e0cc;--card-border:#b8a878;
  --card-selected:#5590dd;--card-hover:#ddd5bb;
  --text:#2a1a00;--text-muted:#7a6a50;
  --green:#2a8040;--green-bg:#d0e8d0;
  --blue:#2255aa;--blue-bg:#c8d8f0;
  --tab-active:#f0ebe0;--tab-inactive:#c0b490;
}

.app{
  display:flex;flex-direction:column;
  height:100vh;width:100vw;
  background:var(--bg);overflow:hidden;
}

/* タブ */
.tabs{display:flex;background:var(--panel);border-bottom:2px solid var(--card-border);flex-shrink:0}
.tab{padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text-muted);border:none;background:var(--tab-inactive);border-right:1px solid var(--card-border)}
.tab.active{background:var(--tab-active);color:var(--text);border-bottom:2px solid var(--tab-active);margin-bottom:-2px}
.tab:hover:not(.active){background:#ccc0a0}

/* メインエリア */
.main{display:flex;flex:1;min-height:0}

/* 左パネル */
.left-panel{
  width:160px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--card-border);
  padding:10px;display:flex;flex-direction:column;gap:7px;
}
.search-box,.filter-select{
  width:100%;padding:5px 7px;font-size:12px;
  border:1px solid var(--card-border);background:#f8f4ea;
  border-radius:4px;color:var(--text);
}
.search-box:focus,.filter-select:focus{outline:none;border-color:var(--blue)}
.general-list{flex:1;overflow-y:auto;border:1px solid var(--card-border);background:#f8f4ea;border-radius:4px;min-height:0}
.general-item{padding:6px 9px;font-size:12px;cursor:pointer;color:var(--text);border-bottom:1px solid #e0d8c0}
.general-item:hover{background:#e8e0cc}
.general-item.sel{background:#d0d8f0;color:#1a3080}
.confirm-btn{padding:7px;background:#4a7a30;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer}
.confirm-btn:hover{background:#3a6a20}
.swap-btn{padding:7px;background:#888;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer}

/* 右パネル */
.right-panel{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  padding:10px;gap:8px;overflow:hidden;
}
.formation-name-input{
  padding:5px 9px;font-size:13px;
  border:1px solid var(--card-border);background:#f8f4ea;
  border-radius:4px;color:var(--text);width:160px;
}
.formation-name-input:focus{outline:none;border-color:var(--blue)}

/* スロットグリッド：狭い時は縮む・広い時は上限で中央寄せ */
.slots-grid-wrap{
  flex:1 1 0;min-height:0;
  display:flex;align-items:flex-start;justify-content:flex-start;
  overflow-x:auto;overflow-y:auto;
}
.slots-grid{
  display:flex;gap:6px;
  align-items:flex-start;
  justify-content:space-between;
  width:100%;
}
.slot-col{
  flex:110;min-width:0;max-width:140px;
  display:flex;flex-direction:column;align-items:center;
  gap:3px;
}
.slot-col-label{font-size:11px;color:var(--text-muted);text-align:center;line-height:16px;white-space:nowrap}

/* カードはcolの幅に追従、正方形 */
.slot-card{
  width:100%;aspect-ratio:1/1;
  border-radius:6px;border:1.5px solid var(--card-border);
  background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:border-color 0.15s;
  overflow:hidden;
}
.slot-card:hover{border-color:#8899cc}
.slot-card.selected{border:2.5px solid var(--card-selected);background:#dce8f8}
.slot-card.empty-slot{background:#e8e2d0}
.slot-card-img{width:100%;height:100%;object-fit:cover;display:block}
.slot-icon{font-size:10px;color:#b0a080;text-align:center;line-height:1.5;white-space:pre-line}
.slot-name{font-size:11px;color:var(--text);font-weight:500;text-align:center;padding:0 2px}
.slot-name-under{
  font-size:11px;color:var(--text);font-weight:500;text-align:center;
  width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;min-height:15px;
}
.slot-rarity{position:absolute;bottom:2px;right:2px;font-size:8px;padding:1px 3px;border-radius:3px;color:#fff;font-weight:500;z-index:2}
.rarity-LG{background:#aa3311}.rarity-SSR{background:#997700}.rarity-SR{background:#4444aa}.rarity-R{background:#3a7a3a}.rarity-N{background:#888}
.sub-label{font-size:9px;color:var(--text-muted)}
.slot-spacer{width:100%;aspect-ratio:1/1;visibility:hidden}

.col-divider{width:80%;height:1px;background:var(--card-border);margin:2px 0;opacity:0.5}

/* プレビューエリア（ステージ画像に各軍の大将アイコンを重ねて表示） */
.preview-panel{
  flex-shrink:0;
  height:150px;
  border:1px solid var(--card-border);
  background:var(--card);
  border-radius:6px;
  display:none;
  flex-direction:column;
  color:var(--text-muted);font-size:12px;
  overflow:hidden;
}
.preview-panel.open{display:flex;height:min(46vh,420px)}

.preview-controls{
  flex-shrink:0;display:flex;gap:6px;align-items:center;
  padding:6px 8px;border-bottom:1px solid var(--card-border);background:var(--panel);
}
.preview-controls select{
  flex:1;min-width:0;padding:5px 7px;font-size:12px;border:1px solid var(--card-border);
  border-radius:4px;background:#f8f4ea;color:var(--text);
}

.preview-stage-outer{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#e4ddc8 0% 25%, #d9d1b6 0% 50%) 50%/16px 16px;
}
.preview-stage-wrap{position:relative;height:100%;max-width:100%;margin:0 auto}
.preview-stage-wrap img#preview-stage-img{width:100%;height:100%;display:block;object-fit:fill}
.preview-overlay{position:absolute;inset:0;pointer-events:none}
.preview-icon{
  position:absolute;border-radius:5px;object-fit:cover;
  border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.4);
}
.preview-empty{font-size:12px;color:var(--text-muted);padding:10px;text-align:center}

/* 行動ボタン */
.action-btn{
  width:100%;
  padding:4px 2px;font-size:9px;font-weight:500;
  border-radius:4px;border:1.5px solid var(--card-border);
  background:var(--card);color:var(--text);
  cursor:pointer;text-align:center;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.action-btn:hover{background:var(--card-hover)}
.action-btn.off{background:#e0dbd0;color:var(--text-muted);border-color:#c0b890}
.action-btn.timing-on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.action-btn.timing-special{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.action-btn.policy-on{background:#f0e0c8;border-color:#c08030;color:#7a4010}
.btn-row-label{font-size:8px;color:var(--text-muted);margin-top:1px}

/* ボトムバー */
.bottom-bar{
  display:flex;gap:8px;padding:8px 10px;
  background:var(--panel);border-top:1px solid var(--card-border);
  flex-shrink:0;
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--card-border);background:var(--card);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:var(--text);
}
.icon-btn:hover{background:var(--card-hover)}

/* ポイント効率タブ */
#tab-point{flex:1;display:flex;flex-direction:column;min-height:0}
.point-wrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px;gap:10px;overflow:hidden}
.point-header{flex-shrink:0;display:flex;align-items:center;gap:8px}
.point-header-label{font-size:12px;color:var(--text-muted)}
.point-select{
  padding:6px 8px;font-size:13px;
  border:1px solid var(--card-border);background:#f8f4ea;
  border-radius:4px;color:var(--text);min-width:140px;
}
.point-select:focus{outline:none;border-color:var(--blue)}

.point-body{flex:1;display:flex;gap:10px;min-height:0}
.point-table-area{
  flex:1;min-width:0;overflow:auto;
  background:#f8f4ea;border:1px solid var(--card-border);border-radius:6px;
}
.point-table{width:100%;border-collapse:collapse;font-size:12px}
.point-table th{
  position:sticky;top:0;z-index:1;
  background:var(--panel);color:var(--text);
  font-weight:600;text-align:center;
  padding:7px 6px;border-bottom:1px solid var(--card-border);white-space:nowrap;
}
.point-table td{
  padding:6px;text-align:center;color:var(--text);
  border-bottom:1px solid #e0d8c0;white-space:nowrap;
}
.point-table tbody tr:hover{background:var(--card-hover)}
.point-table td.point-cell-stage{text-align:left;color:var(--text)}
.point-table tr.point-total-row{background:var(--card);font-weight:600}
.point-table tr.point-total-row td{border-top:1.5px solid var(--card-border);border-bottom:none}
.point-table tr.point-total-row td.point-cell-empty{color:var(--text-muted)}

.point-side{
  width:190px;flex-shrink:0;
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:0;
}
.point-card{
  background:var(--card);border:1.5px solid var(--card-border);border-radius:6px;
  padding:8px 10px;display:flex;align-items:center;justify-content:space-between;
}
.point-card-label{font-size:11px;color:var(--text-muted)}
.point-card-value{font-size:15px;font-weight:600;color:var(--text)}
.point-card.point-card-total{background:var(--blue-bg);border-color:var(--blue)}
.point-card.point-card-total .point-card-label{color:var(--blue)}
.point-card.point-card-total .point-card-value{color:var(--blue)}

@media (max-width: 768px){
  .point-wrap{padding:8px;gap:8px}
  .point-body{flex-direction:column;overflow:auto}
  .point-table-area{flex:none;max-height:46vh}
  .point-side{width:100%;flex-direction:row;flex-wrap:wrap}
  .point-card{flex:1 1 45%}
}

/* シート用の背景（バックドロップ） */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  z-index:900;
}
.sheet-header{display:none}

/* ===== モバイル用レイアウト ===== */
@media (max-width: 768px){
  .left-panel{
    position:fixed;left:0;right:0;bottom:0;
    width:100%;height:72vh;max-height:72vh;
    border-right:none;border-radius:16px 16px 0 0;
    box-shadow:0 -6px 20px rgba(0,0,0,0.25);
    transform:translateY(105%);
    transition:transform .25s ease;
    z-index:950;
    padding:12px 14px 14px;
  }
  .left-panel.open{transform:translateY(0)}
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:2px;
  }
  .sheet-header .sheet-title{font-size:14px;font-weight:600;color:var(--text)}
  .sheet-close{
    width:28px;height:28px;border-radius:50%;border:none;
    background:var(--card-hover);color:var(--text);font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .search-box{font-size:16px;padding:9px 10px} /* 16px以上でiOS自動ズーム防止 */
  .general-item{padding:12px 10px;font-size:14px}
  .confirm-btn{padding:12px;font-size:14px}
  .swap-btn{display:none} /* モバイルはボトムバーのスワップボタンを使用 */

  .right-panel{padding:8px;gap:6px}
  .formation-name-input{width:100%;font-size:16px}

  /* スロットは横スクロールでカードサイズを確保 */
  .slots-grid-wrap{overflow-x:auto;overflow-y:hidden}
  .slots-grid{width:max-content;justify-content:flex-start;gap:10px}
  .slot-col{flex:0 0 92px;max-width:92px;min-width:92px}

  .action-btn{font-size:10px;padding:6px 2px}
  .preview-panel{height:120px}

  .bottom-bar{padding:10px 14px}
  .icon-btn{width:42px;height:42px;font-size:17px}
  .icon-btn.swap-icon-btn{display:flex}

  /* スロットは画面幅に収まるよう縮小表示（横スクロールなし） */
  .slots-grid-wrap{overflow-x:hidden;overflow-y:auto}
  .slots-grid{width:100%;justify-content:space-between;gap:3px}
  .slot-col{flex:1 1 0;min-width:0;max-width:none}
  .slot-col-label{font-size:9px;line-height:12px}
  .sub-label{font-size:7px}
  .slot-name-under{font-size:9px;min-height:12px}
  .slot-icon{font-size:8px}
  .slot-rarity{font-size:6px;padding:0 2px}
  .action-btn{font-size:7px;padding:3px 1px;border-radius:3px}
  .col-divider{margin:1px 0}
}
.icon-btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.icon-btn.swap-icon-btn{display:none}

/* 編成データ貼り付け（復元）モーダル */
.load-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.load-modal-backdrop.open{opacity:1;pointer-events:auto}
.load-modal{
  background:var(--bg);border-radius:10px;padding:16px;
  width:100%;max-width:420px;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  display:flex;flex-direction:column;gap:10px;
}
.load-modal-title{font-size:14px;font-weight:600;color:var(--text)}
.load-modal-textarea{
  width:100%;min-height:120px;padding:8px;font-size:13px;
  border:1px solid var(--card-border);border-radius:6px;
  background:#f8f4ea;color:var(--text);resize:vertical;
  font-family:monospace;line-height:1.4;
}
.load-modal-textarea:focus{outline:none;border-color:var(--blue)}
.load-modal-buttons{display:flex;gap:8px;justify-content:flex-end}
.load-modal-btn{
  padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;
  cursor:pointer;border:1px solid var(--card-border);
}
.load-modal-btn.primary{background:#4a7a30;color:#fff;border-color:#4a7a30}
.load-modal-btn.primary:hover{background:#3a6a20}
.load-modal-btn.secondary{background:var(--card);color:var(--text)}
.load-modal-btn.secondary:hover{background:var(--card-hover)}
@media (max-width: 768px){
  .load-modal-textarea{font-size:16px} /* iOS自動ズーム防止 */
}

/* 撃破武将セル（クリックで敵選択モーダルを開く） */
.point-cell-defeat{cursor:pointer;text-align:left}
.point-cell-defeat:hover{background:var(--card-hover)}
.point-defeat-imgs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.point-defeat-img{width:26px;height:26px;border-radius:4px;object-fit:cover;border:1px solid var(--card-border)}
.point-defeat-placeholder{color:var(--blue);font-size:12px;text-decoration:underline}

/* 敵選択モーダル */
.enemy-modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.enemy-modal-backdrop.open{opacity:1;pointer-events:auto}
.enemy-modal{
  background:var(--bg);border-radius:10px;padding:16px;
  width:100%;max-width:460px;max-height:80vh;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  display:flex;flex-direction:column;gap:10px;overflow:hidden;
}
.enemy-modal-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.enemy-modal-title{font-size:14px;font-weight:600;color:var(--text)}
.enemy-modal-clear-select{
  flex-shrink:0;padding:5px 7px;font-size:12px;
  border:1px solid var(--card-border);background:#f8f4ea;
  border-radius:4px;color:var(--text);
}
.enemy-modal-clear-select:focus{outline:none;border-color:var(--blue)}
.enemy-modal-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;overflow-y:auto;min-height:0}
.enemy-modal-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:76px;cursor:pointer;
}
.enemy-modal-card{
  width:100%;aspect-ratio:1/1;border-radius:6px;
  border:1.5px solid var(--card-border);background:var(--card);
  position:relative;overflow:hidden;transition:border-color 0.15s;
}
.enemy-modal-item:hover .enemy-modal-card{border-color:#8899cc}
.enemy-modal-card.checked{border:2.5px solid var(--card-selected);background:#dce8f8}
.enemy-modal-card-img{width:100%;height:100%;object-fit:cover;display:block}
.enemy-modal-checkmark{
  position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:1.5px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;
}
.enemy-modal-card.checked .enemy-modal-checkmark{background:var(--card-selected);border-color:var(--card-selected);color:#fff}
.enemy-modal-name{
  font-size:11px;color:var(--text);text-align:center;width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.enemy-modal-buttons{display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.enemy-modal-btn{
  padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;
  cursor:pointer;border:1px solid var(--card-border);
}
.enemy-modal-btn.primary{background:#4a7a30;color:#fff;border-color:#4a7a30}
.enemy-modal-btn.primary:hover{background:#3a6a20}
.enemy-modal-btn.secondary{background:var(--card);color:var(--text)}
.enemy-modal-btn.secondary:hover{background:var(--card-hover)}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('edit')">編成</button>
    <button class="tab" onclick="switchTab('point')">ポイント効率</button>
  </div>

  <div id="tab-edit" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="main">
      <div class="left-panel" id="left-panel">
        <div class="sheet-header">
          <span class="sheet-title">武将を選択</span>
          <button class="sheet-close" onclick="closeSheet()">✕</button>
        </div>
        <input class="search-box" type="text" placeholder="武将名を入力" id="search-input"
          oninput="filterList()" onkeydown="handleSearchKeydown(event)">
        <div class="general-list" id="general-list"></div>
        <button class="confirm-btn" onclick="confirmSelection()">確定</button>
        <button class="swap-btn" onclick="toggleSwap()">入替 <span id="swap-status">OFF</span></button>
      </div>
      <div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>

      <div class="right-panel">
        <div><input class="formation-name-input" type="text" placeholder="編成名"></div>
        <div class="slots-grid-wrap">
          <div class="slots-grid" id="slots-grid"></div>
        </div>
        <div class="preview-panel" id="preview-panel">
          <div class="preview-controls">
            <select id="stage-select" onchange="onStageSelectChange()"></select>
          </div>
          <div class="preview-stage-outer" id="preview-stage-outer">
            <div class="preview-empty" id="preview-empty">ステージを選択してください</div>
            <div class="preview-stage-wrap" id="preview-stage-wrap" style="display:none">
              <img id="preview-stage-img" alt="ステージ画像" onload="onStageImageLoad()" onerror="onStageImageError()">

function placeholderImg(name){
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=b8a878&color=fff&size=128&font-size=0.4&bold=true`;
}

// ===== XSS対策：innerHTMLに差し込む文字列は必ずこれを通す =====
// DB(Supabase)由来のデータや、クリップボード貼り付けから復元したデータは
// 信頼できない外部入力として扱い、HTMLとして解釈されないようエスケープする。
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}
// 画像URLは http/https のみ許可（javascript: 等のスキームを弾く）
function safeImgUrl(url){
  try{
    const u = new URL(url, window.location.href);
    if(u.protocol === 'http:' || u.protocol === 'https:') return u.href;
  }catch(e){/* fallthrough */}
  return '';
}

// カタカナ→ひらがな正規化（検索でひらがな/カタカナどちらでも一致させる）
function toHiragana(str){
  return (str||'').replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}

// ===== 撃破武将セル（敵選択モーダル）・クリア回数プルダウン用の状態 =====
// キーは `${arcKey}_${stageIndex}` 形式。
// pointSelections: そのマスでチェックされた敵の名前一覧
// pointClearCounts: そのマスのクリア回数（1〜11。11=「11回以上」）
// ※pointSelectionsは撃破Pt計算に使用する。pointClearCountsは出撃回数ボーナス

let pointSelections = {};

const CLEAR_COUNT_OPTS = ['1回','2回','3回','4回','5回','6回','7回','8回','9回','10回','11回以上'];

function pointKey(arcKey, stageIdx){ return `${arcKey}_${stageIdx}`; }

function pointDummyStages(count){
  const rows = [];
  for(let i=1;i<=count;i++){
    rows.push({
      stage: `第${i}戦場`,
      general: `武将${i}`,
      defeatPt: 1200 + i*137,
      clearPt: 300 + i*45,
      pps: (12.5 + i*0.8).toFixed(1),
      time: `0${1 + (i%3)}:${(10 + i*7)%60 < 10 ? '0' : ''}${(10 + i*7)%60}`,
    });
  }
  return rows;
}

// ===== 敵選択モーダル =====
function openEnemyModal(arcKey, stageIdx){
  const arc = POINT_ARCS.find(a => a.key === arcKey);
  if(!arc) return;
  const stages = POINT_DATA[arc.label] || [];
  const stage = stages[stageIdx];
  if(!stage) return;
  const key = pointKey(arcKey, stageIdx);
  const existing = pointSelections[key] || [];
  enemyModalState = {
    arcKey, stageIdx, enemies: stage.enemies,
    checked: new Set(existing),
    clearCount: pointClearCounts[key] || 1
  };
  renderEnemyModal();
  document.getElementById('enemy-modal-backdrop').classList.add('open');
}
function closeEnemyModal(){
  document.getElementById('enemy-modal-backdrop').classList.remove('open');
  enemyModalState = null;
}
function renderEnemyModal(){
  if(!enemyModalState) return;
  const arc = POINT_ARCS.find(a => a.key === enemyModalState.arcKey);
  const stages = POINT_DATA[arc.label] || [];
  const stage = stages[enemyModalState.stageIdx];
  document.getElementById('enemy-modal-title').textContent =
    `${stage ? stage.stage : ''} 撃破武将を選択`;
  const clearOptions = CLEAR_COUNT_OPTS.map((label, i) => {
    const val = i + 1;
    return `<option value="${val}"${val===enemyModalState.clearCount?' selected':''}>${escapeHtml(label)}</option>`;
  }).join('');
  document.getElementById('enemy-modal-clear-select').innerHTML = clearOptions;
  document.getElementById('enemy-modal-list').innerHTML = enemyModalState.enemies.map((e,i) => {
    const g = GENERALS.find(x => x.name === e.name);
    const src = g ? (safeImgUrl(g.img) || placeholderImg(g.name)) : placeholderImg(e.name);
    const fallback = placeholderImg(e.name);
    const checked = enemyModalState.checked.has(e.name);
    return `<div class="enemy-modal-item" onclick="toggleEnemyChecked(${i})">
      <div class="enemy-modal-card${checked?' checked':''}">
        <img class="enemy-modal-card-img" src="${escapeHtml(src)}" alt="${escapeHtml(e.name)}"
          data-fallback="${escapeHtml(fallback)}" onerror="this.onerror=null;this.src=this.dataset.fallback">

      </div>
      <span class="enemy-modal-name">${escapeHtml(e.name)}</span>

function toggleEnemyChecked(i){
  if(!enemyModalState) return;
  const e = enemyModalState.enemies[i];
  if(!e) return;
  if(enemyModalState.checked.has(e.name)) enemyModalState.checked.delete(e.name);
  else enemyModalState.checked.add(e.name);
  renderEnemyModal();
}

  if(!enemyModalState) return;

  if(!enemyModalState) return;

  pointSelections[key] = Array.from(enemyModalState.checked);

function defeatedCellHTML(arcKey, stageIdx){
  const key = pointKey(arcKey, stageIdx);

    return `<td class="point-cell-defeat" onclick="openEnemyModal('${arcKey}',${stageIdx})">

    const g = GENERALS.find(x => x.name === name);
    const src = g ? (safeImgUrl(g.img) || placeholderImg(g.name)) : placeholderImg(name);
    const fallback = placeholderImg(name);

      data-fallback="${escapeHtml(fallback)}" onerror="this.onerror=null;this.src=this.dataset.fallback">`;
  }).join('');
  return `<td class="point-cell-defeat" onclick="openEnemyModal('${arcKey}',${stageIdx})">

// ===== 撃破Pt計算用の倍率定数 =====
// 討伐アイテム倍率（酒使用時：3倍 ⇒ +2）
const ITEM_MULTIPLIER = 2;
// 盟友集結倍率（発生中：1.05倍 ⇒ +0.05）
const ALLY_MULTIPLIER = 0.05;
// 一番槍ボーナス倍率（適用中：1.2倍 ⇒ +0.2）※1回目の獲得ポイントにのみ適用する
const FIRST_STRIKE_MULTIPLIER = 0.2;

// 1回目：討伐アイテム＋盟友＋一番槍をすべて適用
const MULTIPLIER_FIRST_RUN = 1 + ITEM_MULTIPLIER + ALLY_MULTIPLIER + FIRST_STRIKE_MULTIPLIER;
// 2回目以降：一番槍ボーナスは適用しない
const MULTIPLIER_OTHER_RUN = 1 + ITEM_MULTIPLIER + ALLY_MULTIPLIER;

// ===== 出撃回数ボーナス倍率 =====
// クリア回数（そのマスの出撃回数）に応じた倍率。
// 討伐アイテム・盟友・一番槍の倍率は適用せず、選択した敵ポイント合計に対してのみ掛ける。
const SORTIE_COUNT_BONUS = {
  1: 2.0,
  2: 1.0,
  3: 0.6,
  4: 0.4,
  5: 0.3,
};
function sortieCountBonusMultiplier(count){
  if(count in SORTIE_COUNT_BONUS) return SORTIE_COUNT_BONUS[count];
  if(count >= 6 && count <= 10) return 0.2;
  return 0; // 11回以上
}

// 指定した戦場で選択済みの敵ポイント合計
function selectedEnemyPointSum(arcKey, stageIdx, stage){
  const key = pointKey(arcKey, stageIdx);
  const selectedNames = pointSelections[key] || [];
  return (stage.enemies || [])
    .filter(e => selectedNames.includes(e.name))
    .reduce((sum, e) => sum + e.point, 0);
}

// 討伐編（アーク）全体で選択済みの敵ポイント合計
function totalSelectedEnemyPointSum(arcKey, stages){
  return stages.reduce((sum, s, i) => sum + selectedEnemyPointSum(arcKey, i, s), 0);
}

// 出撃回数ボーナス = 選択した敵ポイント合計 × 出撃回数に応じた倍率
// （討伐アイテム・盟友・一番槍の倍率は適用しない）
function calcSortieCountBonus(arcKey, stageIdx, stage){
  const key = pointKey(arcKey, stageIdx);
  const count = pointClearCounts[key] || 1;
  const enemyPointSum = selectedEnemyPointSum(arcKey, stageIdx, stage);
  return enemyPointSum * sortieCountBonusMultiplier(count);
}

// 撃破Pt（最終獲得Pt）= 通常ポイント（選択した敵ポイント合計 × (1 + 討伐アイテム倍率 + 盟友倍率 + 一番槍倍率)）
//                        ＋ 出撃回数ボーナス
// 端数は最後にfloor。
function calcDefeatPt(arcKey, stageIdx, stage){
  const enemyPointSum = selectedEnemyPointSum(arcKey, stageIdx, stage);
  const normalPt = enemyPointSum * MULTIPLIER_FIRST_RUN;
  const sortieBonus = calcSortieCountBonus(arcKey, stageIdx, stage);
  return Math.floor(normalPt + sortieBonus);
}

function renderPointTab(){
  const select = document.getElementById('point-arc-select');
  const arc = POINT_ARCS.find(a => a.key === select.value) || POINT_ARCS[0];
  const stages = POINT_DATA[arc.label] || [];

  // 撃破Ptは実計算（選択した敵ポイント合計×倍率＋出撃回数ボーナス、floor）。
  // クリアPt・Pt/s・タイムはまだダミー値（ポイント計算は今回対象外）
  const rows = stages.map((s, i) => ({
    stage: s.stage,
    defeatPt: calcDefeatPt(arc.key, i, s),
    clearPt: 300 + i*45,
    pps: (12.5 + i*0.8).toFixed(1),
    time: `0${1 + (i%3)}:${(10 + i*7)%60 < 10 ? '0' : ''}${(10 + i*7)%60}`,
  }));

  const totalDefeat = rows.reduce((sum,r)=>sum + r.defeatPt, 0);
  const totalClear = rows.reduce((sum,r)=>sum + r.clearPt, 0);

  document.getElementById('point-table-body').innerHTML = rows.map((r,i) => `
    <tr>
      <td class="point-cell-stage">${escapeHtml(r.stage)}</td>
      ${defeatedCellHTML(arc.key, i)}
      <td>${r.defeatPt.toLocaleString()}</td>
      <td>${r.clearPt.toLocaleString()}</td>
      <td>${r.pps}</td>
      <td>${r.time}</td>
    </tr>
  `).join('') + `
    <tr class="point-total-row">
      <td class="point-cell-stage">合計</td>
      <td class="point-cell-empty"></td>
      <td>${totalDefeat.toLocaleString()}</td>
      <td>${totalClear.toLocaleString()}</td>
      <td>-</td>
      <td>-</td>
    </tr>
  `;

  // 右下カード：1回目Ptは一番槍ボーナスを含む撃破Ptの合計（＝totalDefeat）。
  // 2回目・3回目Ptは一番槍ボーナスを含まない倍率で選択済み敵ポイント合計から算出する。
  // クリアPtはまだダミー値のため、run系はいずれも撃破Ptのみを対象とする（今回対象外）。
  const totalEnemySum = totalSelectedEnemyPointSum(arc.key, stages);
  const run1 = totalDefeat;
  const run2 = Math.floor(totalEnemySum * MULTIPLIER_OTHER_RUN);
  const run3 = Math.floor(totalEnemySum * MULTIPLIER_OTHER_RUN);
  const runTotal = run1 + run2 + run3;

  document.getElementById('point-side').innerHTML = `
    <div class="point-card">
      <span class="point-card-label">1回目Pt</span>
      <span class="point-card-value">${run1.toLocaleString()}</span>
    </div>
    <div class="point-card">
      <span class="point-card-label">2回目Pt</span>
      <span class="point-card-value">${run2.toLocaleString()}</span>
    </div>
    <div class="point-card">
      <span class="point-card-label">3回目Pt</span>
      <span class="point-card-value">${run3.toLocaleString()}</span>
    </div>
    <div class="point-card point-card-total">
      <span class="point-card-label">合計Pt</span>
      <span class="point-card-value">${runTotal.toLocaleString()}</span>
    </div>
  `;
}

  );

}
function handleSearchKeydown(e){
  if(e.key === 'Tab'){
    if(filteredList.length === 0) return; // 候補が無ければ通常のTab移動に任せる
    e.preventDefault();
    let idx = filteredList.findIndex(g => g.name === selectedGeneral);
    if(e.shiftKey){
      idx = idx <= 0 ? filteredList.length - 1 : idx - 1;
    }else{
      idx = (idx + 1) % filteredList.length;
    }
    selectedGeneral = filteredList[idx].name;
    renderList();
    const list = document.getElementById('general-list');
    const el = list.children[idx];
    if(el) el.scrollIntoView({block:'nearest'});
  }else if(e.key === 'Enter'){
    e.preventDefault();
    if(!selectedGeneral && filteredList.length > 0){
      selectedGeneral = filteredList[0].name;
    }
    confirmSelection();
  }
}
function renderList(){
  const list = document.getElementById('general-list');
  if(GENERALS.length === 0){
    list.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--text-muted)">読み込み中...</div>`;
    return;
  }
  // 名前を直接onclick(JS文字列コンテキスト)に埋め込むと、名前に ' や \ が
  // 含まれた場合にJSインジェクションが成立してしまうため、インデックス経由で呼ぶ。
  list.innerHTML = filteredList.map((g,i)=>
    `<div class="general-item${selectedGeneral===g.name?' sel':''}" onclick="selectGeneralByIndex(${i})">${escapeHtml(g.name)}</div>`
  ).join('');
}

  const empty = document.getElementById('preview-empty');
  empty.textContent = 'ステージ画像の読み込みに失敗しました（stagesフォルダに画像があるか確認してください）';

function onStageImageLoad(){
  const img = document.getElementById('preview-stage-img');
  stageImageNatural = { w: img.naturalWidth || 0, h: img.naturalHeight || 0 };
  renderPreviewOverlay();
}

function renderPreviewOverlay(){
  const empty = document.getElementById('preview-empty');
  const wrap = document.getElementById('preview-stage-wrap');
  const img = document.getElementById('preview-stage-img');
  const overlay = document.getElementById('preview-overlay');

  const layout = currentStageKey ? STAGE_LAYOUTS[currentStageKey] : null;
  if(!layout){
    empty.textContent = 'ステージを選択してください';
    empty.style.display = 'flex';
    wrap.style.display = 'none';
    return;
  }
  if(!layout.image || !layout.points){
    console.error(`STAGE_LAYOUTS['${currentStageKey}'] の形式が正しくありません。image/pointsが揃っているか確認してください。`, layout);
    empty.textContent = `「${currentStageKey}」の配置データが正しく設定されていません（image/pointsを確認してください）`;
    empty.style.display = 'flex';
    wrap.style.display = 'none';
    return;
  }

  // 画像が切り替わるタイミングでは、実サイズが分かるまでアイコンを描画しない
  if(img.getAttribute('src') !== layout.image){
    stageImageNatural = { w: 0, h: 0 };
    img.src = layout.image;
  }
  empty.style.display = 'none';
  wrap.style.display = 'block';

  // 座標計算の基準は、アップロードされているステージ画像そのものの実ピクセルサイズ。
  // (layout.ref を手書きする必要はない。もし書かれていれば画像読み込み完了までの仮値として使う)
  const refW = stageImageNatural.w || (layout.ref && layout.ref.width) || 0;
  const refH = stageImageNatural.h || (layout.ref && layout.ref.height) || 0;
  if(!refW || !refH){
    overlay.innerHTML = ''; // 画像読み込み中。onStageImageLoadで再描画される
    return;
  }
  wrap.style.aspectRatio = `${refW} / ${refH}`;

  overlay.innerHTML = COL_POINT_KEY.map((key, col) => {
    if(!key) return ''; // 軍師はマップ上に表示しない
    const p = layout.points[key];
    if(!p || !Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.size)) return '';
    const g = slots[col] && slots[col].main;
    if(!g) return ''; // その役職が未選択なら表示しない
    const leftPct = (p.x - p.size/2) / refW * 100;
    const topPct  = (p.y - p.size/2) / refH * 100;
    const wPct    = p.size / refW * 100;
    const hPct    = p.size / refH * 100;
    const src = safeImgUrl(g.img) || placeholderImg(g.name);
    return `<img class="preview-icon" src="${escapeHtml(src)}" alt="${escapeHtml(g.name)}"
      style="left:${leftPct}%;top:${topPct}%;width:${wPct}%;height:${hPct}%">`;
  }).join('');
}

function saveScreenshot(){
  const target = document.getElementById('slots-grid');
  if(!target || typeof html2canvas === 'undefined'){
    alert('スクリーンショット機能の読み込みに失敗しました。通信環境を確認してください。');
    return;
  }
  const bgColor = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#f0ebe0';
  html2canvas(target, {
    backgroundColor: bgColor,
    scale: Math.max(window.devicePixelRatio || 1, 2),
    useCORS: true,
    width: target.scrollWidth,
    height: target.scrollHeight
  }).then(canvas => {
    const nameInput = document.querySelector('.formation-name-input');
    const formationName = (nameInput && nameInput.value.trim()) || '編成';
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    const fileName = `${formationName}_${stamp}.png`;

    canvas.toBlob(async (blob) => {
      if(!blob){
        alert('スクリーンショットの保存に失敗しました。');
        return;
      }
      const file = new File([blob], fileName, {type:'image/png'});

      // スマホ：共有シート経由で「写真に保存」できるようにする
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:formationName});
          return;
        }catch(err){
          if(err && err.name === 'AbortError') return; // 共有シートをキャンセルした場合は何もしない
          console.error(err);
          // 共有に失敗した場合は下のダウンロード方式にフォールバック
        }
      }

      // PC・非対応ブラウザ：通常のダウンロード
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = fileName;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }, 'image/png');
  }).catch(err => {
    console.error(err);
    alert('スクリーンショットの保存に失敗しました。');
  });
}

function clickSlot(col,role){
  if(swapMode){
    if(!swapFirst){
      swapFirst = {col,role};
    }else{
      const a=swapFirst, b={col,role};
      const tmp = slots[a.col][a.role];
      slots[a.col][a.role] = slots[b.col][b.role];
      slots[b.col][b.role] = tmp;
      swapFirst = null;
    }
    render();
    return;
  }
  if(selectedSlot && selectedSlot.col===col && selectedSlot.role===role){
    selectedSlot = null;
    closeSheet();
  }else{
    selectedSlot = {col,role};
    openSheet();
  }
  render();
  if(selectedSlot){
    const input = document.getElementById('search-input');
    if(input) setTimeout(()=>input.focus(),260);
  }
}
function cycleTiming(col){ timings[col]=(timings[col]+1)%TIMING_OPTS.length; render(); }
function cyclePolicy(col){ policies[col]=(policies[col]+1)%POLICY_OPTS.length; render(); }

function slotCardHTML(col,role){
  const g = slots[col][role];
  const isSel = swapMode
    ? !!(swapFirst && swapFirst.col===col && swapFirst.role===role)
    : !!(selectedSlot && selectedSlot.col===col && selectedSlot.role===role);
  const selClass = isSel ? ' selected' : '';
  if(g){
    const safeSrc = safeImgUrl(g.img) || placeholderImg(g.name);
    const fallback = placeholderImg(g.name);
    return `<div class="slot-card${selClass}" onclick="clickSlot(${col},'${role}')">
      <img class="slot-card-img" src="${escapeHtml(safeSrc)}" alt="${escapeHtml(g.name)}" data-fallback="${escapeHtml(fallback)}" onerror="this.onerror=null;this.src=this.dataset.fallback">
    </div>`;
  }
  return `<div class="slot-card empty-slot${selClass}" onclick="clickSlot(${col},'${role}')">
    <div class="slot-icon">${isSel?'選択中':'武将を選択'}</div>
  </div>`;
}
function slotNameHTML(col,role){

}

function timingBtnClass(col){

// ===== 編成のコピー＆貼り付け復元 =====
const FORMATION_PREFIX = 'SLOT_FORMATION_V1:';

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(str){
  return decodeURIComponent(escape(atob(str)));
}

function serializeFormation(){
  const nameInput = document.querySelector('.formation-name-input');
  const data = {
    v: 1,
    name: nameInput ? nameInput.value : '',
    slots: slots.map(s => ({
      main: s.main ? s.main.name : null,
      sub: s.sub ? s.sub.name : null
    })),
    timings,
    policies
  };
  return FORMATION_PREFIX + utf8ToBase64(JSON.stringify(data));
}

async function saveFormation(){
  const text = serializeFormation();
  try{
    await navigator.clipboard.writeText(text);
    alert('編成をコピーしました。編成画面で貼り付け（ペースト）すると、この内容で編成が復元されます。');
  }catch(err){
    console.error(err);
    window.prompt('自動コピーに失敗しました。以下のテキストを手動でコピーしてください:', text);
  }
}

// 復元データの武将名は、必ずサーバー(Supabase)から取得済みの既知の武将リスト
// (GENERALS)に存在するものだけを採用する。未知の文字列をそのまま保持して
// 表示に使うと、貼り付けられた編成データ経由で任意のHTML/JSを注入できて
// しまうため（DOM-based XSS）、見つからない場合は「空欄」として扱う。
function findGeneralByName(name){
  if(typeof name !== 'string' || !name) return null;
  return GENERALS.find(g => g.name === name) || null;
}

function loadFormation(data){
  if(!data || !Array.isArray(data.slots)) return;
  slots = COLS.map((_, i) => {
    const s = data.slots[i] || {};
    return { main: findGeneralByName(s.main), sub: findGeneralByName(s.sub) };
  });
  if(Array.isArray(data.timings) && data.timings.length === COLS.length &&
     data.timings.every(v => v === null || (Number.isInteger(v) && v >= 0 && v < TIMING_OPTS.length))){
    timings = data.timings;
  }
  if(Array.isArray(data.policies) && data.policies.length === COLS.length &&
     data.policies.every(v => v === null || (Number.isInteger(v) && v >= 0 && v < POLICY_OPTS.length))){
    policies = data.policies;
  }
  const nameInput = document.querySelector('.formation-name-input');
  // 編成名も信頼できない値なので、textContent的に扱われるinput.valueへの
  // 代入は安全（HTMLとして解釈されない）だが、念のため文字列型・長さを検証する。
  if(nameInput && typeof data.name === 'string'){
    nameInput.value = data.name.slice(0, 100);
  }
  selectedSlot = null;
  swapFirst = null;
  closeSheet();
  render();
}

function restoreFromModal(){
  const ta = document.getElementById('load-modal-textarea');
  const text = ta.value.trim();
  if(!text){
    alert('編成データを貼り付けてください。');
    return;
  }
  if(!text.startsWith(FORMATION_PREFIX)){
    alert(`編成データの形式が正しくありません。「${FORMATION_PREFIX}」から始まる文字列を貼り付けてください。`);
    return;
  }
  try{
    const json = base64ToUtf8(text.slice(FORMATION_PREFIX.length));
    const data = JSON.parse(json);
    loadFormation(data);
    closeLoadModal();
  }catch(err){
    console.error(err);
    alert('編成データの読み込みに失敗しました。コピーした文字列が正しいか確認してください。');
  }
}

document.addEventListener('paste', (e) => {
  if(e.target && e.target.id === 'load-modal-textarea') return; // テキストエリア内は通常のペースト動作に任せる
  const text = (e.clipboardData || window.clipboardData) ? (e.clipboardData || window.clipboardData).getData('text') : '';
  if(!text || !text.startsWith(FORMATION_PREFIX)) return; // 通常のペーストは邪魔しない
  e.preventDefault();
  // 悪意あるサイト等に誘導され、細工した編成データを気づかず貼り付けさせられる
  // 「ペーストジャッキング」対策として、実際に反映する前に必ず確認を挟む。
  if(!confirm('クリップボードの内容を編成データとして読み込みます。よろしいですか？\n（心当たりのない場所からコピーした文字列の場合はキャンセルしてください）')){
    return;
  }
  try{
    const json = base64ToUtf8(text.slice(FORMATION_PREFIX.length));
    const data = JSON.parse(json);
    loadFormation(data);
  }catch(err){
    console.error(err);
    alert('編成データの読み込みに失敗しました。コピーした文字列が正しいか確認してください。');
  }
});

async function init(){
  renderList(); // "読み込み中..." 表示
  render();
  try{
    GENERALS = await fetchGenerals();
    filteredList = [...GENERALS];
    renderList();
  }catch(e){
    console.error(e);
    document.getElementById('general-list').innerHTML =
      `<div style="padding:10px;font-size:12px;color:#aa3311">読み込みに失敗しました。<br>${escapeHtml(e.message)}</div>`;
  }
}
init();
</script>
